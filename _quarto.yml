project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - posts/**/*.qmd
    - physics/**/*.qmd
    - fiction/**/*.qmd

website:
  title: "Tim Gorringe"
  site-url: https://gorringe.github.io

  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Home
      - section: "Physics"
        contents:
          - physics/index.qmd
          - posts/first-physics-book/index.qmd
      - section: "Fiction"
        contents:
          - fiction/index.qmd
      - about.qmd

  page-footer:
    left: "© Tim Gorringe"
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme: cosmo
    css: styles.css
