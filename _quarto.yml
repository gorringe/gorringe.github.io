project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - posts/**/*.qmd
    - physics/**/*.qmd
    - fiction/**/*.qmd

website:
  title: "Tim Gorringe"
  site-url: https://gorringe.github.io

  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Home
      - section: "Physics"
        contents:
          - href: posts/first-physics-book/index.qmd
            text: Physics beginnings
          - posts/physics-problems/index.qmd
          - posts/new-dimension/index.qmd
          - posts/monster-force/index.qmd
          - posts/ethereal-mediator/index.qmd
          - posts/beginnings-endings/index.qmd
          - posts/what-is-energy/index.qmd
          - posts/jars-of-charge/index.qmd
          - posts/batteries-and-resistors/index.qmd
      - section: "Fiction"
        contents: []
      - about.qmd

  page-footer:
    left: "© Tim Gorringe"
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme: cosmo
    css: styles.css
